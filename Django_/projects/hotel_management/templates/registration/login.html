{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <link rel="stylesheet" href="{% static 'booking/style.css' %}">
</head>
<body>
    <div class="page-shell login-shell">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark">Hotel</span>
                <span>StayEase</span>
            </div>
        </header>
        <section class="section-block login-block">
            <div class="login-card">
                <h1>Admin Login</h1>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">Log in</button>
                </form>
            </div>
        </section>
    </div>
</body>
</html>
