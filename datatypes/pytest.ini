[pytest]
# Minimum Python version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-report=lcov

# Markers for categorizing tests
markers =
    primitives: tests for primitive data types
    type_casting: tests for type casting operations
    introspection: tests for introspection features
    classes: tests for class implementations
    dunder: tests for dunder methods
    data_structures: tests for data structures

# Coverage options
[coverage:run]
branch = True
source = app

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov
